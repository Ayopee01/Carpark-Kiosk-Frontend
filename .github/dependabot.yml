# Dependabot: เปิด PR อัปเดต dependency ทุกสัปดาห์ PR จะผ่าน CI ก่อน merge
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต package"
    # รวม minor/patch เป็น PR เดียว ส่วน major แยก PR ตาม package
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint ยังรองรับแค่ TypeScript < 6.1 (TS 7 ทำให้ lint ใช้ไม่ได้)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ต้องตรงกับ Node ที่ใช้รันจริง (.nvmrc = 24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "อัปเดต action"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "อัปเดต image"
    ignore:
      # อยู่บน Node 24 LTS จนกว่าจะตัดสินใจย้ายพร้อม .nvmrc
      - dependency-name: node
        update-types: ["version-update:semver-major"]
